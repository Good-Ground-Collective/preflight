name: Release

on:
  push:
    branches: [main]

# Least-privilege token scopes semantic-release needs:
# contents (tags + GitHub Releases), packages (publish), issues + PRs (release comments).
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so semantic-release can read tags and prior commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Self-verify before publishing: the release job is the last line of defense,
      # so it re-runs the full CI gate rather than trusting a parallel workflow.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          # Built-in token — no repo secrets to configure. NPM_TOKEN authenticates
          # the publish to GitHub Packages; GITHUB_TOKEN creates the release + tag.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
